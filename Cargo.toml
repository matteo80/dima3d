[package]
name = "gestore-wrl"
version = "0.1.0"
edition = "2021"
license = "MIT"

[[bin]]
name = "gestore-wrl"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.31", features = ["wgpu"] }
egui = "0.31"
wgpu = "24"
glam = { version = "0.29", features = ["bytemuck"] }
memmap2 = "0.9"
rayon = "1.10"
rstar = "0.12"
rfd = "0.15"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
bytemuck = { version = "1.19", features = ["derive"] }
egui-phosphor = "0.9"

[dev-dependencies]
pollster = "0.4"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"

[profile.dev]
opt-level = 1

[build-dependencies]
winresource = "0.1"
